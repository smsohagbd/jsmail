{{define "title"}}Edit Template #{{add .Index 1}} — Force From{{end}}
{{define "content"}}
<div class="page-header">
  <div>
    <div class="page-title">Edit Template #{{add .Index 1}}</div>
    <div class="page-sub">Update the subject and body for this rotation slot</div>
  </div>
  <a href="/user/force-from" class="btn btn-ghost" style="font-size:13px;">← Back</a>
</div>

<div class="page-body">

{{if .FlashOK}}<div style="background:#052e16;border:1px solid #14532d;color:#4ade80;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;">✓ {{.FlashOK}}</div>{{end}}
{{if .FlashErr}}<div style="background:#1c0606;border:1px solid #450a0a;color:#f87171;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;">✗ {{.FlashErr}}</div>{{end}}

<div class="card" style="padding:20px 24px;max-width:720px;">
  <form method="POST" action="/user/force-from/template/save">
    <input type="hidden" name="index" value="{{.Index}}"/>
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">Subject
        <span style="font-size:11px;color:#52525b;font-weight:400;margin-left:4px;">(leave empty to keep original)</span>
      </label>
      <input class="form-input" name="subject" value="{{.Template.Subject}}" placeholder="Leave empty to keep original subject"/>
    </div>
    <div class="form-group" style="margin-bottom:22px;">
      <label class="form-label">Body
        <span style="font-size:11px;color:#52525b;font-weight:400;margin-left:4px;">(plain text or HTML · leave empty to keep original)</span>
      </label>
      <textarea class="form-input" name="body" rows="12"
        style="font-family:monospace;font-size:13px;resize:vertical;"
        placeholder="Leave empty to keep original body.">{{.Template.Body}}</textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/user/force-from" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

</div>
{{end}}
